<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-label="FirmForge logo mark">
  <title>FirmForge</title>

  <!--
    Layer Stack mark — 4 bars (brand-500 #2b6aff), left-aligned, decreasing width.
    Node dot (brand-400 #5291ff) at each bar's right end, white halo disk behind it.
    Diagonal polyline trace (brand-400 @ 0.35 opacity) connecting all four nodes.

    Color tokens (tailwind.config.ts):
      brand-500  #2b6aff  → bars
      brand-400  #5291ff  → nodes + trace
      white      #ffffff  → halo (fill-opacity 0.15)
  -->

  <!-- ── Bars (brand-500 #2b6aff) ── -->
  <!-- bar 1 : x=8  width=54  right edge=62  center-y=13.5 -->
  <rect x="8"  y="11" width="54" height="5" rx="2" fill="#2b6aff"/>
  <!-- bar 2 : x=8  width=42  right edge=50  center-y=28.5 -->
  <rect x="8"  y="26" width="42" height="5" rx="2" fill="#2b6aff"/>
  <!-- bar 3 : x=8  width=30  right edge=38  center-y=43.5 -->
  <rect x="8"  y="41" width="30" height="5" rx="2" fill="#2b6aff"/>
  <!-- bar 4 : x=8  width=18  right edge=26  center-y=58.5 -->
  <rect x="8"  y="56" width="18" height="5" rx="2" fill="#2b6aff"/>

  <!-- ── Diagonal trace (brand-400 #5291ff @ 0.35) ── -->
  <polyline
    points="62,13.5 50,28.5 38,43.5 26,58.5"
    stroke="#5291ff"
    stroke-width="1"
    stroke-opacity="0.35"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ── Node halos (white disk, z-order: behind dots) ── -->
  <circle cx="62" cy="13.5" r="6"  fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="50" cy="28.5" r="6"  fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="38" cy="43.5" r="6"  fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="26" cy="58.5" r="6"  fill="#ffffff" fill-opacity="0.15"/>

  <!-- ── Node dots (brand-400 #5291ff) ── -->
  <circle cx="62" cy="13.5" r="3.5" fill="#5291ff"/>
  <circle cx="50" cy="28.5" r="3.5" fill="#5291ff"/>
  <circle cx="38" cy="43.5" r="3.5" fill="#5291ff"/>
  <circle cx="26" cy="58.5" r="3.5" fill="#5291ff"/>
</svg>
